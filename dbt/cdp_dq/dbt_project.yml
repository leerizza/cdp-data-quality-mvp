name: 'cdp_dq'
version: '1.0.0'

profile: 'cdp_dq'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  cdp_dq:
    # Staging models are thin source cleanups, so views are cheaper than
    # materialising them. The cdp/ models are left as dbt's default.
    staging:
      +materialized: view
